# =============================================================================
# campus-login-v2 非敏感配置（凭据永不写入本文件）
# 取值说明: key = value （= 两侧可有空格，行首 # 为注释）
# =============================================================================

# 在线探测地址与期望 HTTP 码（返回该码即视为已认证在线）
# 2026-09-06 由小米 connect.rom.miui.com 改为华为云专用联通性检测(规避小米风控)
probe_url = http://connectivitycheck.platform.hicloud.com/generate_204
probe_ok_code = 204

# 强制门户探测地址（未认证时会被拦截并 302 到认证页）
portal_url = http://1.1.1.1/

# 网络超时（秒）: 连接超时 / 单请求总时长上限
net_connect_timeout = 6
net_max_time = 15

# 登录失败后的有限重试次数与间隔（秒）
login_retries = 3
login_retry_sleep = 2

# 一轮全部尝试失败后的冷静期（秒）：期间只探测、不发起登录；默认 30 分钟
cooldown_after_fail = 1800
# 冷静期状态文件（留空= /tmp/campus_login.cooldown；勿放闪存避免磨损）
state_file =

# 时段闸门（可选，空=不限制，由 cron 决定调度；如恢复原 7-23 语义可填 7 / 23）
# start_hour =
# end_hour =

# TLS 证书校验: 0=严格（默认，推荐）；1=关闭（仅当门户证书自签无法信任时）
net_insecure = 0

# 日志级别: debug | info | warn | error
log_level = warn
